services:
  docorg-web:
    # build: .
    # Or use a pre-built image:
    image: ghcr.io/amitrke/docorganizer-web:latest
    container_name: docorg-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Config file (required)
      - /volume1/docorganizer/config.web.yaml:/data/config.web.yaml:ro

      # Database — single file, mounted read-write so SQLite WAL files can be created
      - /volume1/docorganizer/docorganizer.db:/data/docorganizer.db

      # Inbox — where new scans land. Read-write: the in-process watcher and
      # browser uploads both write here, and the watcher removes files once filed.
      - /volume1/docorganizer/scans:/data/scans

      # Filed documents — the browsable archive. Read-write: the "Re-file" and
      # "Apply AI suggestion" actions in the browser move files within this tree.
      - /volume1/docorganizer/documents:/data/documents
    environment:
      - PYTHONUNBUFFERED=1
    # Optional: run as a non-root user matching your Synology file ownership
    # user: "1026:100"
